name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Prevent concurrent deployments of the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Pages
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Static Site
        run: npm run build

      - name: 📋 Ensure Cloudflare Headers in Build Output
        run: |
          if [ -f public/_headers ]; then
            cp -f public/_headers out/_headers
            echo "✅ Successfully synced public/_headers to out/_headers."
          fi

      - name: 🚀 Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1. Create project if it doesn't exist yet (ignore error if already exists)
          npx --yes wrangler pages project create salar-portfolio --production-branch=main || true
          
          # 2. Deploy static output to Cloudflare Pages
          npx --yes wrangler pages deploy out --project-name=salar-portfolio --branch=main --commit-dirty=true

      - name: 🧹 Purge Cloudflare Edge Cache (Optional)
        if: secrets.CLOUDFLARE_ZONE_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          echo "Purging Cloudflare edge cache for zone $CLOUDFLARE_ZONE_ID..."
          PURGE_RES=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$PURGE_RES"

